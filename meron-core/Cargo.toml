[package]
name = "meron-core"
version = "0.1.0"
edition = "2024"
description = "Meron core engine sidecar (mail IMAP/SMTP/MIME, RSS, storage) driven over JSON-lines stdio"

[[bin]]
name = "meron-core"
path = "src/main.rs"

[lib]
name = "meron_core"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
socket2 = "0.6.3"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.7"
futures = "0.3.32"
mailparse = "0.16.1"
html-to-markdown-rs = { version = "3.4.1", default-features = false }
anyhow = "1.0.102"
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl"] }
async-smtp = { version = "0.10.2", default-features = false, features = ["runtime-tokio"] }
mail-builder = "0.4.4"
base64 = "0.22.1"
# OpenPGP. The pure-Rust crypto backend rather than the default Nettle one:
# this crate is cross-compiled to windows-msvc, macOS and Android, and a C
# library per target is a build system nobody wants to maintain.
sequoia-openpgp = { version = "2", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
ureq = { version = "3.3.0", features = ["socks-proxy"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Forked for the calendar item properties the published crate does not model
# (see adilelhaji/ews-rs#calendar-item-properties, offered upstream); the same
# arrangement the repo already uses for its async-imap fork. Back to crates.io
# once Thunderbird releases the change.
ews = { git = "https://github.com/adilelhaji/ews-rs.git", branch = "calendar-item-properties" }
# Already in the tree through `ews`, whose DateTime wraps `time`'s; declared
# directly so calendar writes can build one. No new supply chain.
time = "0.3"
# Subscribed calendars are a file, not a server, so nothing expands their
# recurrence rules for us. This parses iCalendar and — through the `rrule`
# types it reexports — expands them, which is a job for an RFC implementation
# rather than for hand-rolled date arithmetic.
icalendar = { version = "0.17", features = ["recurrence"] }
feed-rs = "2.3.1"
quick-xml = "0.37.5"
scraper = "0.27.0"
ammonia = "4.1.2"
sha2 = { version = "0.11.0", features = ["oid"] }
sha1 = { version = "0.11.0", features = ["oid"] }
pkcs8 = "0.11.0"
# The reader's own S/MIME identity — a PKCS#12 (.p12/.pfx) file with a
# password, the shape every mail client and CA hands out a personal
# certificate as. Same RustCrypto family as cms/x509-cert; earlier pre-release
# than either (0.2.0-pre.0), which for a file holding the reader's own private
# key is a real cost weighed and accepted rather than defaulted into — see the
# module doc for the reasoning already applied to cms itself.
pkcs12 = { version = "0.2.0-pre.0", features = ["kdf"] }
aes = "0.9.0-rc.1"
cbc = "0.2.0-rc.1"
des = "0.9.0-rc.1"
rc2 = "0.9.0"
# Modern PKCS#12 exports (OpenSSL 3.x default) protect each bag with PBES2 +
# PBKDF2 rather than the legacy RFC 7292 Appendix B KDF above; needed to read
# those files' certificate and key bags.
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
# S/MIME: CMS (RFC 5652) parsing/verification and the X.509 certificates it
# carries. Pure Rust, like Sequoia's crypto-rust backend for OpenPGP — the
# same reason applies: this crate cross-compiles to windows-msvc, macOS and
# Android, and a C library (OpenSSL) per target is not a build system anyone
# here wants to maintain. `cms` is pre-1.0 (RustCrypto/formats, the same org
# behind `der`/`x509-cert`/`rsa`/`pkcs8`, not an unknown crate); the API may
# still move, which is an accepted cost against re-adding a C toolchain.
cms = "=0.3.0-pre.1"
x509-cert = { version = "0.3.0", features = ["std"] }
rsa = "0.10.0-rc.1"
der = "0.8.1"
chrono = "0.4.44"
url = "2.5.8"
# Already resolved by url; decode Graph's equivalent OData continuation paths.
percent-encoding = "2.3.2"
uuid = { version = "1.23.1", features = ["v4"] }
hickory-resolver = { version = "0.26.1", features = ["system-config"] }
ring = "0.17"
x509-parser = "0.18.1"
# S/MIME signing/encrypting on send needs real randomness — the RSA
# key-transport padding and the AES content-encryption key/IV — that
# `rsa`'s own `encrypt`/`sign` calls require the caller to supply. Version
# pinned to the 0.10 line specifically because that is the one whose
# `rand_core` matches what `rsa` 0.10.0-rc already depends on.
rand = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1.1"

# Fork adds a `gmail_thread_id()` accessor (X-GM-THRID) missing from upstream.
[patch.crates-io]
async-imap = { git = "https://github.com/nonbili/async-imap.git", rev = "d04be74" }
# Maddy 0.8 (and potentially other real-world IMAP servers) serializes an
# empty BODYSTRUCTURE parameter list as `()` instead of the RFC-mandated NIL.
# Keep the compatibility patch local and covered by the vendored crate's tests.
imap-proto = { path = "../third_party/imap-proto" }
