name: oreneta
title: Oreneta
base: core22
adopt-info: oreneta
summary: Mail and calendar, at home with Exchange
description: |
  Oreneta is a mail and feed client. It speaks IMAP/SMTP, Exchange (EWS) and
  reads RSS feeds, with a fast Rust core engine bundled as a sidecar.

grade: stable
confinement: strict
compression: xz

# The wails app (build/bin/oreneta) and the desktop/icon assets are produced by
# the GitHub Actions workflow before snapcraft runs. The `dump` part just stages
# the prebuilt files into the snap; no compilation happens inside snapcraft.
parts:
  oreneta:
    plugin: dump
    source: snap/local
    # Track the version declared in wails.json so the snap version always
    # follows the app version without editing this file.
    override-build: |
      craftctl default
      version="$(sed -n 's/.*"productVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$CRAFT_PROJECT_DIR/wails.json")"
      craftctl set version="$version"
    organize:
      oreneta: bin/oreneta
      oreneta.desktop: usr/share/applications/oreneta.desktop
      oreneta.png: usr/share/icons/hicolor/512x512/apps/oreneta.png
    stage-packages:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
      - libgles2

apps:
  oreneta:
    command: bin/oreneta
    extensions: [gnome]
    desktop: usr/share/applications/oreneta.desktop
    plugs:
      - home
      - network
      - network-bind
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7
      - browser-support
      # Manual-connect: snapd never auto-connects this, so out of the box the
      # Secret Service is denied and the core falls back to its local file
      # keyring. Connecting the interface later enables the desktop keyring for
      # new profiles; profiles already using the fallback remain on it.
      - password-manager-service
      - audio-playback

slots:
  oreneta:
    interface: dbus
    bus: session
    name: jp.nonbili.oreneta
