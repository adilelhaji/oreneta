name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ci/*.test.cjs
      - run: python3 scripts/translation-models/test_mirror.py
      # Until the owner picks the developer id (#249), the one warning allowed
      # is developer-id-missing; it is still printed. Anything else fails.
      - name: Validate Flatpak metainfo
        run: |
          sudo apt-get update && sudo apt-get install -y appstream
          status=0
          out="$(appstreamcli validate --explain metadata/flatpak/io.github.adilelhaji.oreneta.metainfo.xml 2>&1)" || status=$?
          echo "$out"
          [ "$status" -eq 0 ] && exit 0
          echo "$out" | grep -q 'Validation failed: warnings: 1$' || exit 1
          echo "$out" | grep -q ': developer-id-missing$' || exit 1

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Wails (package main) links against GTK/WebKitGTK via cgo.
      - name: Install GTK/WebKitGTK headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Create frontend/dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder
      - name: Test with statement coverage
        run: |
          mkdir -p coverage
          go test -tags webkit2_41 -coverprofile=coverage/go.out ./...
          go tool cover -func=coverage/go.out | tail -1 | tee coverage/go-summary.txt
      # A distributable build must not carry Meron's OAuth registrations and
      # must refuse sign-in without Oreneta-owned ones (#144).
      - name: Distributable build fails closed without owned OAuth
        run: |
          go test -tags "webkit2_41 distributable" -run 'OAuth|Distributable' -count=1 .
          go build -tags "webkit2_41 distributable" -o "$RUNNER_TEMP/oreneta-distributable" .
          node scripts/ci/inherited-oauth.cjs "$RUNNER_TEMP/oreneta-distributable"
      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go-${{ github.sha }}
          path: coverage/
          if-no-files-found: error

  go-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native input ABI without sending input
        shell: pwsh
        run: ./scripts/test-windows-startup.ps1 -ValidateInputLayout
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Create frontend/dist placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          New-Item -ItemType File frontend/dist/placeholder | Out-Null
      - run: go test ./...

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # `perl` is required by openssl-src (vendored OpenSSL via rusqlite's
        # bundled-sqlcipher-vendored-openssl feature) — its Configure script
        # needs core modules like FindBin, IPC::Cmd and Time::Piece.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config perl
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            meron-core
            third_party/tokio-xmpp
      - name: Test vendored IMAP parser compatibility
        run: cargo test --manifest-path third_party/imap-proto/Cargo.toml
      # Locally patched: its receiver no longer loses a wake-up (#220).
      - name: Test patched tokio-xmpp
        run: cargo test --manifest-path third_party/tokio-xmpp/Cargo.toml --no-default-features --locked
      # The engine's tests run under llvm-cov, which executes the same suite
      # with instrumented binaries; a failing test fails this step as before.
      - name: Test the engine with line coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov --manifest-path meron-core/Cargo.toml --lcov --output-path coverage/rust.lcov
          cargo llvm-cov report --manifest-path meron-core/Cargo.toml --summary-only | tee coverage/rust-summary.txt
      # The runner's clock is UTC, where calendar dates and instants coincide.
      # Run the calendar tests again east and west of UTC, where they do not;
      # the reminders too, whose all-day ones ring by the local midnight (#209).
      # Auckland is UTC+12 or +13, where a UTC midday is already the next
      # date (#221).
      - name: Calendar tests outside UTC
        run: |
          TZ=Asia/Tokyo cargo test --manifest-path meron-core/Cargo.toml --lib -- calendar:: pim::reminders::
          TZ=America/Los_Angeles cargo test --manifest-path meron-core/Cargo.toml --lib -- calendar:: pim::reminders::
          TZ=Pacific/Auckland cargo test --manifest-path meron-core/Cargo.toml --lib -- calendar:: pim::reminders::
      # POP3 against a real Dovecot (#97): deletion at QUIT, UIDLs and
      # dot-stuffing as a server does them, which the fake server cannot vouch for.
      - name: POP3 against Dovecot
        run: |
          sudo apt-get install -y dovecot-pop3d
          sudo systemctl stop dovecot || true
          sudo bash meron-core/tests/dovecot-pop3.sh /tmp/oreneta-pop3 11110
          cargo test --manifest-path meron-core/Cargo.toml --lib pop3::tests::against_dovecot -- --nocapture
        env:
          ORENETA_DOVECOT_POP3: 127.0.0.1:11110
          ORENETA_DOVECOT_DIR: /tmp/oreneta-pop3
      # Chat against a real Prosody (#111): delivery, receipts, stream
      # management and catching up from the archive without duplicates;
      # rooms (two people, rejoining) and a file over HTTPS upload with the
      # script's throwaway authority (ADR-0044).
      - name: Chat against Prosody
        run: |
          sudo apt-get install -y prosody
          sudo systemctl stop prosody || true
          sudo bash meron-core/tests/prosody-xmpp.sh /tmp/oreneta-xmpp 15222
          cargo test --manifest-path meron-core/Cargo.toml --lib chat::tests::against_prosody -- --nocapture
        env:
          ORENETA_PROSODY: 127.0.0.1:15222
          ORENETA_PROSODY_CA: /tmp/oreneta-xmpp/certs/ca.pem
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust-${{ github.sha }}
          path: coverage/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install localization test dependencies
        run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Generate localization catalogs
        run: bun scripts/i18n/catalog.ts generate
      - name: Validate localization catalogs and tests
        run: |
          bun scripts/i18n/catalog.ts validate
          bun test scripts/i18n/catalog.test.ts
      - run: bun run typecheck
        working-directory: frontend
      - name: Test with line coverage
        run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text --coverage-dir=coverage
        working-directory: frontend
      # As for the core's calendar: in UTC all-day dates and instants coincide.
      # Run the agenda tests again west and east of UTC (#212, ADR-0059).
      - name: Calendar tests outside UTC
        run: |
          TZ=America/Sao_Paulo bun test src/lib/agenda.test.ts src/components/chat/SidebarAgenda.test.tsx
          TZ=Australia/Sydney bun test src/lib/agenda.test.ts src/components/chat/SidebarAgenda.test.tsx
          # Dragging events keeps the wall clock across a clock change (#266).
          TZ=Europe/Madrid bun test src/lib/calendarDrag.test.ts
        working-directory: frontend
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend-${{ github.sha }}
          path: frontend/coverage/
          if-no-files-found: error
      # The real Spanish→English model for the translation checks (#106):
      # published by Mozilla, 22 MB, checked against the app's registry.
      - name: Cache the translation test model
        uses: actions/cache@v4
        with:
          path: frontend/.translation-models
          key: translation-model-${{ hashFiles('meron-core/src/translation/registry.json') }}
      - name: Fetch the translation test model
        run: node scripts/fetch-translation-test-model.mjs
        working-directory: frontend
      - name: Verify production React runtime resolution
        run: bun run test:bundler
        working-directory: frontend
      - name: Install baseline browser
        run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - name: Capture and verify synthetic baseline
        run: bun run baseline:verify
        working-directory: frontend
      - name: Verify production app startup and navigation
        run: bun run startup:verify
        working-directory: frontend
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ github.sha }}
          path: |
            frontend/baseline-results/
            frontend/playwright-report/
            frontend/startup-results/
            frontend/startup-report/
          if-no-files-found: error

  # The production desktop binary on Linux with WebKitGTK (#115): two launches
  # in a fresh profile must start the core and have the app in the webview
  # call it, under the production CSP. Screenshots and logs are kept.
  linux-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meron-core
      - name: Install GTK/WebKitGTK, Xvfb and screenshot tools
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb imagemagick perl
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Build the app
        run: |
          bun scripts/i18n/catalog.ts generate
          (cd frontend && bun run build)
          cargo build --manifest-path meron-core/Cargo.toml
          go build -tags "desktop,production,webkit2_41" -o build/bin/oreneta .
      - name: Start natively twice
        run: bash scripts/test-desktop-startup.sh build/bin/oreneta native-startup-linux
        env:
          MERON_CORE_SERVER: ${{ github.workspace }}/meron-core/target/debug/oreneta-core
      - name: Upload native Linux startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-startup-linux-${{ github.sha }}
          path: native-startup-linux/
          if-no-files-found: warn

  # The same startup check on macOS with WKWebView (#115), on GitHub's hosted
  # runner. Startup only: keychain, notifications, printing, IME and
  # install/update on macOS are not covered by it.
  macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meron-core
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Build the app
        run: |
          bun scripts/i18n/catalog.ts generate
          (cd frontend && bun run build)
          cargo build --manifest-path meron-core/Cargo.toml
          # wails build adds this framework on macOS; a plain go build must too.
          CGO_LDFLAGS="-framework UniformTypeIdentifiers" go build -tags "desktop,production" -o build/bin/oreneta .
      - name: Start natively twice
        run: bash scripts/test-desktop-startup.sh build/bin/oreneta native-startup-macos
        env:
          MERON_CORE_SERVER: ${{ github.workspace }}/meron-core/target/debug/oreneta-core
      - name: Upload native macOS startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-startup-macos-${{ github.sha }}
          path: native-startup-macos/
          if-no-files-found: warn

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Gradle preBuild/generate tasks run the localization scripts through Bun.
      - uses: oven-sh/setup-bun@v2
      - uses: gradle/actions/setup-gradle@v4
      - run: ./mobile/gradlew -p mobile :shared:allTests :ui:allTests

  # Full-stack suite: Rust sidecar against a real maddy mail server in Docker.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meron-core
      - name: Install GTK/WebKitGTK headers
        # `perl` is required by openssl-src (vendored OpenSSL via rusqlite's
        # bundled-sqlcipher-vendored-openssl feature) — its Configure script
        # needs core modules like FindBin, IPC::Cmd and Time::Piece.
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev perl
      - name: Create frontend/dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder
      - run: docker pull foxcpp/maddy:0.8
      # CardDAV/CalDAV route: Radicale with htpasswd auth, see radicale_harness_test.go.
      - run: docker pull tomsquest/docker-radicale:3.5.4.0
      - run: cargo build --manifest-path meron-core/Cargo.toml
      - name: Run isolated mail flows with machine-readable results
        run: |
          mkdir -p integration-results
          go test -tags 'integration webkit2_41' -json -count=1 -timeout 10m . > integration-results/events.jsonl
        env:
          # No Secret Service on CI runners; the sidecar's keyring no-op mode.
          MERON_KEYRING: 'off'
      # The raw events stay on the runner by design (see provider-acceptance.md);
      # what a failing test printed is shown here, in the job log, so a red job
      # can be diagnosed without re-running it blind.
      - name: Show failing integration tests
        if: failure()
        run: |
          node -e '
            const fs = require("fs");
            const output = new Map();
            const failed = [];
            for (const line of fs.readFileSync("integration-results/events.jsonl", "utf8").split("\n")) {
              if (!line.trim()) continue;
              let event; try { event = JSON.parse(line); } catch { continue; }
              const key = event.Test || "(package)";
              if (event.Action === "output") output.set(key, (output.get(key) || "") + event.Output);
              if (event.Action === "fail" || event.Action === "build-fail") failed.push(key);
            }
            if (failed.length === 0) console.log("no failing test recorded; see the step above for the process error");
            for (const name of failed) {
              console.log("::group::FAIL " + name);
              console.log(output.get(name) || "(no output)");
              console.log("::endgroup::");
            }
          '
      - name: Summarize isolated mail acceptance
        if: always()
        env:
          EVIDENCE_SHA: ${{ github.sha }}
          EVIDENCE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/ci/provider-acceptance.cjs integration-results/events.jsonl integration-results/report.json "$EVIDENCE_SHA" "$EVIDENCE_RUN" "$EVIDENCE_ATTEMPT"
      - name: Upload isolated mail acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-mail-acceptance-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: integration-results/report.json
          if-no-files-found: error
      - name: Repeat IDLE readiness and push acceptance
        run: go test -tags 'integration webkit2_41' -run 'TestIntegrationMailFlow/idle_pushes_folder_updates_while_watched' -count=3 -timeout 5m .
        env:
          MERON_KEYRING: 'off'
